<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#080B10"/><stop offset=".58" stop-color="#11151C"/><stop offset="1" stop-color="#24180D"/></linearGradient>
    <linearGradient id="orange" x1="80" y1="60" x2="1130" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD28A"/><stop offset=".48" stop-color="#FF9F1C"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <linearGradient id="cyan" x1="800" y1="90" x2="1120" y2="290" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A5F3FC"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(440 240 -210 390 1000 160)" gradientUnits="userSpaceOnUse"><stop stop-color="#F97316" stop-opacity=".22"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#FDBA74" stroke-opacity=".055"/></pattern>
    <filter id="blur" x="710" y="5" width="500" height="350" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <style>
    .heading{font-family:'Space Grotesk','Inter','Segoe UI',Arial,sans-serif;font-weight:700;letter-spacing:-2px}
    .body{font-family:'Inter','Segoe UI',Arial,sans-serif}
    .small{font-family:'Inter','Segoe UI',Arial,sans-serif;letter-spacing:1.7px}
    .float{animation:float 6s ease-in-out infinite}
    .orbit{transform-origin:965px 180px;animation:orbit 24s linear infinite}
    .pulse{animation:pulse 3.8s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.float,.orbit,.pulse{animation:none}}
  </style>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glow)"/>
  <ellipse cx="970" cy="180" rx="220" ry="140" fill="#F97316" opacity=".18" filter="url(#blur)"/>
  <path d="M0 324H1200" stroke="#FF9F1C" stroke-opacity=".2"/>
  <path d="M615 0L475 360M654 0L514 360" stroke="#FDBA74" stroke-opacity=".055"/>
  <rect x="78" y="62" width="54" height="4" rx="2" fill="url(#orange)"/>
  <text x="78" y="106" fill="#FDBA74" font-size="13" font-weight="700" class="small">FULL-STACK DEVELOPER</text>
  <text x="74" y="177" fill="#FFF7ED" font-size="59" class="heading">Misam Shaban</text>
  <text x="80" y="221" fill="#E7E5E4" font-size="19" class="body">Building end-to-end web experiences.</text>
  <g class="body">
    <rect x="80" y="255" width="88" height="35" rx="17.5" fill="#F59E0B" fill-opacity=".15" stroke="#FDBA74" stroke-opacity=".8"/><text x="124" y="278" text-anchor="middle" fill="#FFEDD5" font-size="13" font-weight="600">React</text>
    <rect x="178" y="255" width="95" height="35" rx="17.5" fill="#F59E0B" fill-opacity=".12" stroke="#FDBA74" stroke-opacity=".65"/><text x="225" y="278" text-anchor="middle" fill="#FFEDD5" font-size="13" font-weight="600">Node.js</text>
    <rect x="283" y="255" width="96" height="35" rx="17.5" fill="#F97316" fill-opacity=".13" stroke="#FDBA74" stroke-opacity=".65"/><text x="331" y="278" text-anchor="middle" fill="#FFEDD5" font-size="13" font-weight="600">Express</text>
    <rect x="389" y="255" width="108" height="35" rx="17.5" fill="#164E63" fill-opacity=".22" stroke="#67E8F9" stroke-opacity=".55"/><text x="443" y="278" text-anchor="middle" fill="#CFFAFE" font-size="13" font-weight="600">MongoDB</text>
    <text x="80" y="326" fill="#A8A29E" font-size="11" class="small">CODE  ·  BUILD  ·  LEARN  ·  IMPROVE</text>
  </g>
  <g class="float">
    <rect x="700" y="55" width="425" height="245" rx="20" fill="#0D1118" stroke="#FDBA74" stroke-opacity=".35"/>
    <path d="M700 106H1125" stroke="#FDBA74" stroke-opacity=".18"/>
    <circle cx="728" cy="81" r="5" fill="#FB923C"/><circle cx="746" cy="81" r="5" fill="#FBBF24"/><circle cx="764" cy="81" r="5" fill="#4ADE80"/>
    <text x="795" y="86" fill="#A8A29E" font-size="11" class="body">FULL-STACK FLOW</text>
    <g>
      <rect x="733" y="141" width="105" height="106" rx="14" fill="#23180E" stroke="#FF9F1C" stroke-opacity=".8"/>
      <circle cx="785" cy="173" r="17" fill="#F59E0B" fill-opacity=".25" stroke="#FDBA74"/>
      <path d="M777 173L783 179L794 166" stroke="#FFEDD5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="785" y="215" text-anchor="middle" fill="#FFEDD5" font-size="12" font-weight="700" class="body">FRONTEND</text><text x="785" y="232" text-anchor="middle" fill="#C4B5A5" font-size="10" class="body">React</text>
    </g>
    <g>
      <rect x="883" y="141" width="105" height="106" rx="14" fill="#1D1A16" stroke="#FDBA74" stroke-opacity=".78"/>
      <circle cx="935" cy="173" r="17" fill="#C2410C" fill-opacity=".24" stroke="#FDBA74"/>
      <path d="M927 167H943M927 173H939M927 179H941" stroke="#FFEDD5" stroke-width="2" stroke-linecap="round"/>
      <text x="935" y="215" text-anchor="middle" fill="#FFEDD5" font-size="12" font-weight="700" class="body">BACKEND</text><text x="935" y="232" text-anchor="middle" fill="#C4B5A5" font-size="10" class="body">Node · Express</text>
    </g>
    <g>
      <rect x="1033" y="141" width="70" height="106" rx="14" fill="#102027" stroke="#67E8F9" stroke-opacity=".7"/>
      <ellipse cx="1068" cy="169" rx="9" ry="4" stroke="#CFFAFE" stroke-width="1.6"/><path d="M1059 169V181C1059 187 1077 187 1077 181V169M1059 175C1059 181 1077 181 1077 175" stroke="#CFFAFE" stroke-width="1.4"/>
      <text x="1068" y="215" text-anchor="middle" fill="#CFFAFE" font-size="11" font-weight="700" class="body">DATA</text><text x="1068" y="232" text-anchor="middle" fill="#A5DDE5" font-size="9" class="body">MongoDB</text>
    </g>
    <path d="M838 194H883M988 194H1033" stroke="url(#orange)" stroke-width="2.3"/><path d="M875 188L883 194L875 200M1025 188L1033 194L1025 200" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="912" y="278" text-anchor="middle" fill="#A8A29E" font-size="10" class="small">FROM INTERFACE TO DATABASE</text>
  </g>
  <circle cx="1160" cy="48" r="3" fill="#FDBA74" class="pulse"/><circle cx="670" cy="295" r="2.5" fill="#67E8F9" class="pulse"/>
</svg>