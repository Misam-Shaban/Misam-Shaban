<text x="100" y="340" font-size="17" fill="#FDBA74">const</text><text x="164" y="340" font-size="17" fill="#F5F5F4">numbers = [4, 8, 15, 16, 23, 42];</text>
<text x="100" y="390" font-size="17" fill="#FDBA74">function</text><text x="190" y="390" font-size="17" fill="#67E8F9">findMaximum</text><text x="335" y="390" font-size="17" fill="#F5F5F4">(values) {</text>
<text x="132" y="430" font-size="17" fill="#C4B5A5">let max = values[0];</text>
<text x="132" y="470" font-size="17" fill="#C4B5A5">for (const value of values) {</text>
<text x="164" y="510" font-size="17" fill="#C4B5A5">if (value &gt; max) max = value;</text>
<text x="132" y="550" font-size="17" fill="#C4B5A5">}</text><text x="100" y="580" font-size="17" fill="#F5F5F4">}</text>
