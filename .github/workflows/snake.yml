name: Generate contribution snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Misam-Shaban
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C2410C&color_dots=%23FFFFFF,%23FDE7C3,%23FDBA74,%23FB923C,%23F97316
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFEDD5&color_dots=%230D1117,%237C2D12,%23C2410C,%23F97316,%23FF9F1C

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
